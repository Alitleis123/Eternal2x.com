name: Release

# Publishing is driven by the tag, and the tag is derived from VERSION by
# Installer/build_release.py. Doing it here rather than by hand is what stops
# the archives, the tag and update/latest.json from drifting apart, which is
# how 0.2.0 shipped download links that pointed at a tag that never existed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, so two runs cannot race to write the feed on main.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Build the commit the tag points at. Checking out main here would ship
      # whatever landed after the tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches VERSION
        if: github.event_name == 'push'
        run: |
          version=$(python -c "print(open('VERSION',encoding='utf-8-sig').read().strip())")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${version}."
            echo "The tag must be v${version} or the download URLs will 404."
            exit 1
          fi

      # Auto-update is on by default, so a broken release reaches every user
      # the next time they open the panel.
      - name: Run the test suite
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0
          pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q

      - name: Build, publish and verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python Installer/build_release.py --publish

      # The tag can be behind main, so carry the new feed over to main rather
      # than pushing the tag's commit.
      - name: Commit the refreshed update feed to main
        run: |
          version=$(python -c "print(open('VERSION',encoding='utf-8-sig').read().strip())")
          cp update/latest.json "$RUNNER_TEMP/latest.json"
          git fetch origin main
          # -f: the feed was just rewritten here, and a copy is saved above.
          # Without it the checkout refuses whenever main's feed has moved on.
          git checkout -f -B main origin/main
          # A re-run of an older tag must not move the feed back, or installs
          # between the two versions would never be offered the newer one.
          if ! python - "$RUNNER_TEMP/latest.json" update/latest.json <<'PY'
          import json, sys
          def version(path):
              with open(path, encoding="utf-8-sig") as f:
                  return tuple(int(p) for p in json.load(f)["version"].split("."))
          sys.exit(0 if version(sys.argv[1]) >= version(sys.argv[2]) else 1)
          PY
          then
            echo "main's feed is for a newer version. Leaving it alone."
            exit 0
          fi
          cp "$RUNNER_TEMP/latest.json" update/latest.json
          if git diff --quiet -- update/latest.json; then
            echo "update/latest.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/latest.json
          git commit -m "Refresh the update feed for ${version}"
          git push origin main
