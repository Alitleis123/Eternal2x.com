name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Tests only read the repository. Actions are pinned to commits, since a tag
# can be moved to point at different code.
permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # OpenCV links against these on a bare Linux runner.
      - name: Install OpenCV system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Without it, the tests that run the shipped upscaler skip. They run it
      # on the CPU, so one job is enough.
      - name: Install ONNX Runtime
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: pip install onnxruntime

      - name: Run the suite
        run: python -m pytest -q

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pyflakes
      - name: Check for unused imports and undefined names
        run: python -m pyflakes Pipeline Stages Installer tests

  package:
    name: release build is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      # Building the same commit twice must produce identical archives, or the
      # checksums in update/latest.json cannot be trusted by anyone who did not
      # build them.
      - name: Build twice and compare
        run: |
          python Installer/build_release.py
          sha256sum release/*.zip > /tmp/first.txt
          python Installer/build_release.py
          sha256sum release/*.zip > /tmp/second.txt
          diff /tmp/first.txt /tmp/second.txt

      # A plain build must leave the feed alone. The feed describes what is
      # published, and rewriting it from the working tree is how the 0.3.1
      # feed ended up with checksums for archives nobody had uploaded.
      - name: Check a build leaves update/latest.json untouched
        run: git diff --exit-code -- update/latest.json

      # The release folders are committed copies of the source. The packaging
      # test only compares the Python files already in them, so check them all.
      - name: Check the committed release folders match the source
        run: |
          git status --porcelain -- release/
          test -z "$(git status --porcelain -- release/)"

      - name: Check the feed matches the files on the release
        run: python Installer/build_release.py --verify
